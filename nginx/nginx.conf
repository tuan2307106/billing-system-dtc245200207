# =============================================================================
# CẤU HÌNH NGINX REVERSE PROXY & BẢO MẬT (NGINX HARDENING)
# Môn học: Triển khai và Quản trị Hệ thống Phần mềm (TKQT HTPM K23)
# Đề tài 18: Hệ thống Quản lý Hóa đơn / Billing
# Cột mốc: Bước 3 - Commit 1
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Định dạng Log chi tiết bao gồm thời gian phản hồi (phục vụ Promtail và Loki)
    log_format main_extended '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$http_x_forwarded_for" '
                             'rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_extended;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # BIỆN PHÁP HARDENING: Ẩn thông tin phiên bản Nginx trong HTTP Header
    server_tokens off;

    # Tối ưu nén Gzip giảm băng thông
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype;

    # ĐỊNH NGHĨA CÁC UPSTREAM SERVICES
    upstream billing_web_backend {
        server billing-web:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream pgadmin_backend {
        server billing-pgadmin:80 max_fails=3 fail_timeout=10s;
    }

    # =========================================================================
    # 1. HTTP SERVER (CỔNG 80)
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # Endpoint giám sát trạng thái Nginx nội bộ cho Prometheus / Metric Scraper
        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }

        # Bổ sung Security Headers ngay cả trên cổng HTTP
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Chuyển tiếp lưu lượng đến Web App hoặc có thể redirect sang HTTPS
        location / {
            proxy_pass http://billing_web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }

    # =========================================================================
    # 2. HTTPS SERVER (CỔNG 443) VỚI CHỨNG CHỈ SSL TỰ KÝ & SECURITY HEADERS
    # =========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Đường dẫn chứng chỉ SSL/TLS
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Cấu hình giao thức và thuật toán mã hóa an toàn (Hardening SSL)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # CÁC TIÊU ĐỀ BẢO MẬT BẮT BUỘC (HTTP SECURITY HEADERS)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https: cdn.jsdelivr.net cdnjs.cloudflare.com; font-src 'self' https: cdnjs.cloudflare.com data:; img-src 'self' https: data:;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ĐIỀU HƯỚNG TRUY CẬP ỨNG DỤNG WEB BILLING CHÍNH
        location / {
            proxy_pass http://billing_web_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # REVERSE PROXY ĐẾN CÔNG CỤ QUẢN TRỊ CSDL PGADMIN
        location /pgadmin/ {
            proxy_pass http://pgadmin_backend/;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
        }

        # TRANG LỖI TÙY CHỈNH
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
