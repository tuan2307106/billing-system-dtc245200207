{% extends "base.html" %}

{% block title %}Thông báo lỗi hệ thống{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card border-0 shadow-sm p-4">
            <i class="fa-solid fa-triangle-exclamation text-warning display-1 mb-3"></i>
            <h4 class="fw-bold text-dark">Đã xảy ra sự cố kết nối</h4>
            <p class="text-muted">{{ message or 'Hệ thống đang bảo trì hoặc chưa sẵn sàng phục vụ.' }}</p>
            <div>
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                    <i class="fa-solid fa-rotate me-1"></i> Tải lại trang chủ
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
