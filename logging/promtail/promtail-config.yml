# =============================================================================
# CẤU HÌNH BỘ THU THẬP VÀ ĐẨY NHẬT KÝ PROMTAIL (PROMTAIL-CONFIG.YML)
# Thu thập toàn bộ log container Docker và Nginx đẩy về Loki
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://billing-loki:3100/loki/api/v1/push

scrape_configs:
  # Thu thập log container Docker trực tiếp qua tệp json-file log
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
            tag: tag
            time: time
      - regex:
          expression: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/.*'
          source: filename
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: output
