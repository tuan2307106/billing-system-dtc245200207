# =============================================================================
# TỰ ĐỘNG THIẾT LẬP NGUỒN DỮ LIỆU GRAFANA (DATASOURCE PROVISIONING)
# Tự động nạp Prometheus và Loki khi khởi động Grafana mà không cần tạo thủ công
# =============================================================================

apiVersion: 1

datasources:
  # Nguồn số liệu Metrics: Prometheus
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://billing-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  # Nguồn nhật ký Logs: Loki
  - name: Loki
    type: loki
    access: proxy
    url: http://billing-loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
