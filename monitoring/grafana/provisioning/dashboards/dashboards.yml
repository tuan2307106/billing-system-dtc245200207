# =============================================================================
# TỰ ĐỘNG NẠP DASHBOARD GRAFANA (DASHBOARD PROVISIONING)
# =============================================================================

apiVersion: 1

providers:
  - name: 'Smart Billing Dashboards'
    orgId: 1
    folder: 'Billing System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
